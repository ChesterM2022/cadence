<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cadence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d07a52"/>
      <stop offset="1" stop-color="#b0512c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- cycle ring -->
  <circle cx="256" cy="256" r="118" fill="none" stroke="#faf4ee" stroke-width="30" stroke-linecap="round"
          stroke-dasharray="555 186" transform="rotate(-90 256 256)"/>
  <!-- phase marker -->
  <circle cx="256" cy="138" r="30" fill="#faf4ee"/>
</svg>
